# Production-shaped lab stack.
# Edge: Nginx proxy (HTTP 8088 / HTTPS 8443) + ssh-target :2222
# Internal: step-ca + redis + portal (portal also on edge for Feishu egress)
# Configs are baked into images; CA/redis state uses named volumes
# (bind mounts often fail against a remote Docker daemon).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  step-ca:
    build: ./step-ca
    image: ssh-ca-lab-step-ca:local
    container_name: ssh-ca-lab-step-ca
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DOCKER_STEPCA_INIT_NAME: "SSH Lab CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "step-ca,localhost,127.0.0.1"
      DOCKER_STEPCA_INIT_SSH: "true"
      DOCKER_STEPCA_INIT_PASSWORD: "${DOCKER_STEPCA_INIT_PASSWORD}"
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: "admin"
      DOCKER_STEPCA_INIT_ADDRESS: ":9000"
    volumes:
      - step-ca-data:/home/step
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - ca
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "step ca health -f 2>/dev/null || (test -f /home/step/certs/ssh_user_ca_key.pub && step certificate fingerprint /home/step/certs/root_ca.crt >/dev/null)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    build: ./redis
    image: ssh-ca-lab-redis:local
    container_name: ssh-ca-lab-redis
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    volumes:
      - redis-data:/data
    networks:
      - ca
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M

  ssh-target:
    build:
      context: .
      dockerfile: ssh-target/Dockerfile
    image: ssh-ca-lab-ssh-target:local
    container_name: ssh-ca-lab-ssh-target
    restart: unless-stopped
    init: true
    logging: *default-logging
    hostname: ssh-target
    depends_on:
      step-ca:
        condition: service_healthy
    environment:
      CA_USER_PUBKEY: /home/step/certs/ssh_user_ca_key.pub
      SRE_PASSWORD: "${SRE_PASSWORD:-sre}"
      STEP_CA_URL: https://step-ca:9000
      ROOT_CA_PATH: /home/step/certs/root_ca.crt
      PROVISIONER_NAME: admin
      PROVISIONER_PASSWORD: "${PROVISIONER_PASSWORD}"
      SSH_HOST_IDENTITY: ssh-target
      SSH_HOST_PRINCIPALS: "ssh-target,localhost,127.0.0.1,${SSH_HINT_HOST:-}"
      HOST_CERT_TTL: "720h"
    volumes:
      - step-ca-data:/home/step:ro
    ports:
      - "2222:22"
    networks:
      - ca
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  idp-portal:
    build: ./idp-portal
    image: ssh-ca-lab-idp-portal:local
    container_name: ssh-ca-lab-idp-portal
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /work
      - /home/step-client
    depends_on:
      step-ca:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      STEP_CA_URL: https://step-ca:9000
      ROOT_CA_PATH: /home/step/certs/root_ca.crt
      PROVISIONER_NAME: admin
      PROVISIONER_PASSWORD: "${PROVISIONER_PASSWORD}"
      PORTAL_USER: "${PORTAL_USER:-demo}"
      PORTAL_PASSWORD: "${PORTAL_PASSWORD:-demo}"
      CERT_TTL: "${CERT_TTL:-1h}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      SESSION_HTTPS_ONLY: "${SESSION_HTTPS_ONLY:-false}"
      ALLOW_LOCAL_LOGIN: "${ALLOW_LOCAL_LOGIN:-true}"
      REDIS_URL: redis://redis:6379/0
      FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
      FEISHU_APP_SECRET: "${FEISHU_APP_SECRET:-}"
      FEISHU_REDIRECT_URL: "${FEISHU_REDIRECT_URL:-http://127.0.0.1:8088/auth/feishu/callback}"
      FEISHU_AUTH_URL: "${FEISHU_AUTH_URL:-https://accounts.feishu.cn/open-apis/authen/v1/authorize}"
      FEISHU_TOKEN_URL: "${FEISHU_TOKEN_URL:-https://accounts.feishu.cn/oauth/v3/token}"
      FEISHU_USERINFO_URL: "${FEISHU_USERINFO_URL:-https://open.feishu.cn/open-apis/authen/v1/user_info}"
      FEISHU_SCOPES: "${FEISHU_SCOPES:-contact:user.email:readonly contact:user.employee_id:readonly}"
      PORTAL_PUBLIC_URL: "${PORTAL_PUBLIC_URL:-http://127.0.0.1:8088}"
      SSH_HINT_HOST: "${SSH_HINT_HOST:-}"
      SSH_HINT_PORT: "${SSH_HINT_PORT:-2222}"
    volumes:
      - step-ca-data:/home/step:ro
    networks:
      - ca
      - edge
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M

  proxy:
    build: ./proxy
    image: ssh-ca-lab-proxy:local
    container_name: ssh-ca-lab-proxy
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      idp-portal:
        condition: service_healthy
    ports:
      - "8088:8080"
      - "8443:8443"
    tmpfs:
      - /tmp
      - /var/cache/nginx
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

volumes:
  step-ca-data:
  redis-data:

networks:
  edge:
    driver: bridge
  ca:
    driver: bridge
    internal: false
