# Extra hardening on the control plane (Feishu-only, HTTPS cookies).
#   docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Point PORTAL_PUBLIC_URL / FEISHU_REDIRECT_URL at https://<host>:8443
# and replace the proxy self-signed cert with a real one.

services:
  idp-portal:
    environment:
      ALLOW_LOCAL_LOGIN: "false"
      SESSION_HTTPS_ONLY: "true"
      CERT_TTL: "${CERT_TTL:-8h}"
